[project]
name = "dq-cli"
version = "0.1.0"
description = "量化选股系统 · 线下采集与计算 CLI（包名 dq）"
requires-python = ">=3.11"

# v1 必装依赖（《环境与初始化文档》§7）
dependencies = [
    "psycopg[binary]",
    "redis",
    "pydantic",
    "pandas",
    "pyyaml",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
dq = "dq.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["dq"]
omit = ["dq/.venv/*", "*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
