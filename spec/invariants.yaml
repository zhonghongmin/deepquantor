# ── 禁用词：出现即报错（口径歧义的历史遗留叫法）──────────────────────
banned_terms:
  - term: 主库
    reason: 须明确区分「线下分析库（写权威）」与「线上展示库（只读副本）」
  - term: 实时计算
    reason: 线上页面禁止实时算；一切计算在线下 CLI 完成
  - term: 硬编码
    reason: 配置必须经 env 注入

# ── 受控词表：同一概念只允许一种叫法 ────────────────────────────────
controlled_terms:
  - concept: 线下分析库
    allowed: [线下分析库, offline 分析库, 线下库]
    forbidden: [主库, 业务库]
  - concept: 线上展示库
    allowed: [线上展示库, 线上库, 展示库]
    forbidden: [主库]
  - concept: 写权威
    allowed: [写权威, 唯一写权威]
    forbidden: [读写一体]

# ── 跨章节冲突对：两处描述同一事实时须一致 ───────────────────────────
conflict_pairs:
  - fact: 数据库表数量
    locations:
      - doc: 量化选股系统·数据库设计文档
        anchor: 表清单
      - doc: 量化选股系统·环境与初始化文档
        anchor: 验收断言
  - fact: 管理端页面数量
    locations:
      - doc: 量化选股系统·系统设计总文档
        anchor: 路由与页面清单
      - doc: 量化选股系统·需求文档
        anchor: 管理端

# ── 结构断言：数量关系必须成立（D-21 三处同源）──────────────────────
structure_assertions:
  - id: SA-01
    desc: 管理端页面清单唯一真值源 → 页目录 / section id / 导航项 / 路由目录四集合相等
    scope: web/app/admin
    rule: counts_equal
    equals: [pages, sections, route_keys]
  - id: SA-02
    desc: 资产配置四项之和 = 1.0
    scope: cli/dq/macro
    rule: sum_equals
    target: AssetAlloc
    value: 1.0

# ── 计数规则：口径必须显式声明，禁止各文档各算各的 ─────────────────────
count_rules:
  - name: 表数量
    definition: 仅统计 8 个业务 schema 下 base table，不含分区子表
    excludes: [pg_inherits 子表, 视图, 序列]
  - name: 章节数
    definition: Markdown 二级及以上标题计数
  - name: 表格数
    definition: Markdown 表格块计数
